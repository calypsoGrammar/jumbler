<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/jumbler/assets/favicon-82fbd818.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
    <title>Jumbler</title>
    <script type="module" crossorigin src="/jumbler/assets/index-74a38374.js"></script>
    <link rel="stylesheet" href="/jumbler/assets/index-5c89e07d.css">
  </head>
  <body
  class='min-h-screen max-h-screen font-f1 text-md'
  x-data="{
    menu:true,
  }"
  >

  <div class='bg-mod_dark text-mod_light' hidden></div>

    <nav
    id="NAV"
    class="z-30 absolute bg-mod_light text-mod_dark top-[6px] left-1/2 transform -translate-x-1/2 flex flex-col justify-start items-center shadow-lg w-full max-w-xl rounded-lg">

      <div
      class="flex flex-row justify-around items-center w-full h-12"
      >

        <button
        id="ORIGINAL"
        type="button"
        aria-label="Show original image"
        aria-pressed="true"
        class="flex justify-center items-center active:scale-95 hover:scale-105"
        ></button>

        <p class="flex justify-center items-center cursor-auto mx-2">
          <span class="sr-only">Completed </span><span id="COMPLETED"></span>
        </p>

        <button
        id="JUMBLE"
        type="button"
        aria-label="Jumble tiles"
        class="flex justify-center items-center active:scale-95 hover:scale-105"
        ></button>

        <button
        id="SCALE_DOWN"
        type="button"
        aria-label="Decrease puzzle scale"
        class="flex justify-center items-center active:scale-95 hover:scale-105 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100 text-3xl"
        >-</button>

        <output id="SCALE_VALUE" aria-label="Current puzzle scale" class="w-12 text-center">60%</output>

        <button
        id="SCALE_UP"
        type="button"
        aria-label="Increase puzzle scale"
        class="flex justify-center items-center active:scale-95 hover:scale-105 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100 text-3xl"
        >+</button>

        <button
        id="MENU_TOGGLE"
        type="button"
        aria-label="Settings"
        aria-controls="MENU"
        aria-expanded="true"
        class="flex justify-center items-center active:scale-95 hover:scale-105"
        x-bind:aria-expanded="String(menu)"
        x-on:click="menu=!menu"
        >
          <span id="DOWN" class="flex" x-show="!menu" style="display:none;"></span>
          <span id="UP" class="flex" x-show="menu"></span>
        </button>

      </div>

      <div
      x-show="menu"
      id="MENU"
      class="relative rounded-lg bg-mod_light text-mod_dark mt-4 max-h-[500px] overflow-hidden overflow-y-auto py-4 flex flex-col justify-start items-center w-full">

        <div class='flex flex-row justify-between items-center w-[250px]'>
          <label class='m-2' for="ROWS">rows</label>
          <input type="number" class="text-center m-2 bg-mod_light text-mod_dark rounded-lg w-20" id="ROWS" min="1" max="32" step="1" value="4">
        </div>

        <div class='flex flex-row justify-between items-center w-[250px]'>
          <label class='m-2' for="COLUMNS">columns</label>
          <input type="number" class="text-center m-2 bg-mod_light text-mod_dark rounded-lg w-20" id="COLUMNS" min="1" max="32" step="1" value="4">
        </div>

        <div class='flex flex-row justify-between items-center w-[250px]'>
          <span class='m-2' aria-hidden="true">theme</span>
          <button
          id="THEME"
          type="button"
          aria-label="Dark theme"
          aria-pressed="false"
          class="flex justify-center items-center m-2 active:scale-95 hover:scale-105 w-20"
          ></button>
        </div>

        <div class='flex flex-col justify-start items-center my-2'>

          <label for="UPLOADED" class="flex justify-center items-center mx-4 text-center">current</label>
          <select class="flex justify-center items-center rounded-lg m-4 border border-black rounded-lg p-2 active:scale-95" id="UPLOADED" style="min-width: 200px; max-width:250px"></select>    
          <button
          id="PLAY"
          type="button"
          disabled
          class="m-2 p-2 active:scale-95 bg-mod_dark text-mod_light rounded-lg hover:bg-mod_dark_light flex justify-center items-center border border-mod_light"
          >play</button>

          <p id="IMPORT_HEADING" class='m-2'>import</p>

          <div
          role="group"
          aria-labelledby="IMPORT_HEADING"
          class='flex flex-row justify-center items-center'>
            <input
            hidden
            id="IMPORT"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
            multiple />
            <button
            id="SELECT"
            type="button"
            aria-label="Select images"
            class="m-2 p-2 active:scale-95 bg-mod_dark text-mod_light rounded-lg hover:bg-mod_dark_light flex justify-center items-center border border-mod_light"
            >select</button>
            <button
            id="LOAD"
            type="button"
            aria-label="Load selected images"
            class="m-2 p-2 active:scale-95 bg-mod_dark text-mod_light rounded-lg hover:bg-mod_dark_light flex justify-center items-center border border-mod_light"
            >load</button>
          </div>
          <p id="STATUS" role="status" aria-live="polite" class="mx-4 text-center"></p>

        </div>

      </div>

    </nav>

    <div class="absolute w-full overflow-auto top-[60px]">
      <div class="relative flex justify-center items-center w-full">
        <canvas
        id="CANVAS"
        tabindex="0"
        role="application"
        aria-label="Jumbler puzzle"
        aria-describedby="PUZZLE_HELP"
        ></canvas>
      </div>
    </div>

    <p id="PUZZLE_HELP" class="sr-only">Use the arrow keys to move between tiles, and Home or End to jump to the start or end of a row. Press Enter or Space to select a tile, then move to another tile and press Enter or Space to swap them. Press Escape to cancel a selection.</p>
    <p id="PUZZLE_STATUS" role="status" aria-live="polite" class="sr-only"></p>

  </body>
  
</html>
