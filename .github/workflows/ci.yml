# Checks for pull requests and main. Read-only: it never publishes. The deploy
# (deploy.yml) publishes only a commit of main on which this job passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Archon's own pull requests are verified on the droplet before they are published
    # (archon.verify posts this check's status). This job runs on main, on people's branches and
    # pull requests, and on any branch when started by hand.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref || github.ref_name, 'archon/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The unit tests. The browser check in `npm test` (scripts/verify-browser.mjs)
      # needs a global Playwright install and does not run here.
      - run: node --test
      - run: npm run build
