<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Jumbler browser import test</title>
<pre id="results">Running…</pre>
<script type="module">
const results = document.getElementById('results');
const frame = document.createElement('iframe');
frame.src = '../index.html';
document.body.append(frame);

function check(condition, message)
{
  if(!condition) throw new Error(message);
}

function selectFiles(input, files)
{
  const transfer = new DataTransfer();
  for(const file of files) transfer.items.add(file);
  input.files = transfer.files;
}

function corruptPng()
{
  const bytes = new Uint8Array(33);
  bytes.set([137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82]);
  new DataView(bytes.buffer).setUint32(16, 100);
  new DataView(bytes.buffer).setUint32(20, 100);
  return bytes;
}

try
{
  await new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = reject;
  });
  const page = frame.contentWindow;
  const $ = id => page.document.getElementById(id);
  check($('PLAY').disabled, 'play must start disabled');

  selectFiles($('IMPORT'), [new File(['text'], 'notes.txt', { type: 'text/plain' })]);
  await page.jumbler.import();
  check($('ERROR').textContent.includes('notes.txt'), 'unsupported file error is visible');
  check($('UPLOADED').options.length === 0, 'unsupported file entered selector');

  selectFiles($('IMPORT'), [new File([corruptPng()], 'broken.png', { type: 'image/png' })]);
  await page.jumbler.import();
  check($('ERROR').textContent.includes('decode failed'), 'decode error is visible');
  check($('UPLOADED').options.length === 0 && $('PLAY').disabled, 'failed decode enabled play');

  const imageCanvas = document.createElement('canvas');
  imageCanvas.width = 100;
  imageCanvas.height = 100;
  imageCanvas.getContext('2d').fillRect(0, 0, 100, 100);
  const blob = await new Promise(resolve => imageCanvas.toBlob(resolve, 'image/png'));
  selectFiles($('IMPORT'), [new File([blob], 'good.png', { type: 'image/png' })]);
  await page.jumbler.import();
  check($('UPLOADED').options.length === 1 && !$('PLAY').disabled, 'valid image is not playable');
  $('PLAY').click();
  const previousImage = page.jumbler.current_img;
  const previousFragments = page.jumbler.fragments;
  const previousWidth = $('CANVAS').width;

  selectFiles($('IMPORT'), [new File([corruptPng()], 'again.png', { type: 'image/png' })]);
  await page.jumbler.import();
  $('ROWS').value = '100000';
  $('PLAY').click();
  check($('ERROR').textContent.includes('Rows and columns'), 'grid error is visible');
  check($('UPLOADED').options.length === 1 && !$('PLAY').disabled, 'previous selection changed');
  check(page.jumbler.current_img === previousImage && page.jumbler.fragments === previousFragments &&
    $('CANVAS').width === previousWidth, 'invalid input changed the playable puzzle');
  results.textContent = 'PASS: import, decode, selector, play, and puzzle preservation';
}
catch(error)
{
  results.textContent = `FAIL: ${error.stack || error}`;
  throw error;
}
</script>
</html>
